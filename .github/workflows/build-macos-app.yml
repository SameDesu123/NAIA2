name: Build upstream macOS releases

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream release tag to rebuild (blank selects the latest release)
        required: false
        type: string

concurrency:
  group: upstream-macos-release-build
  cancel-in-progress: false

jobs:
  resolve:
    name: Find new upstream releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tags: ${{ steps.releases.outputs.release_tags }}
      should_build: ${{ steps.releases.outputs.should_build }}
    steps:
      - name: Select release tags
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
          UPSTREAM_REPOSITORY: DNT-LAB/NAIA2.0
        run: |
          gh api "repos/${UPSTREAM_REPOSITORY}/releases?per_page=100" \
            > upstream-releases.json
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > origin-releases.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          upstream = json.loads(Path("upstream-releases.json").read_text(encoding="utf-8"))
          origin = json.loads(Path("origin-releases.json").read_text(encoding="utf-8"))
          if not upstream:
              raise SystemExit("The upstream repository has no GitHub releases")

          requested = os.environ.get("REQUESTED_TAG", "").strip()
          upstream_tags = [release["tag_name"] for release in upstream]
          if requested:
              if requested not in upstream_tags:
                  raise SystemExit(f"Unknown upstream release tag: {requested}")
              selected = [requested]
          elif os.environ["EVENT_NAME"] == "workflow_dispatch":
              selected = [upstream_tags[0]]
          else:
              origin_tags = {release["tag_name"] for release in origin}
              mirrored_index = next(
                  (index for index, tag in enumerate(upstream_tags) if tag in origin_tags),
                  None,
              )
              if mirrored_index is None:
                  # Establish a baseline without rebuilding the entire release history.
                  selected = [upstream_tags[0]]
              else:
                  # GitHub returns newest first; publish multiple new releases oldest first.
                  selected = list(reversed(upstream_tags[:mirrored_index]))

          should_build = bool(selected)
          matrix_tags = selected if selected else ["__no_release__"]
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"release_tags={json.dumps(matrix_tags, separators=(',', ':'))}\n")
              output.write(f"should_build={str(should_build).lower()}\n")

          print("Selected upstream releases:", ", ".join(selected) if selected else "none")
          PY

  build:
    name: Build ${{ matrix.release_tag }} for ${{ matrix.display_name }}
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        release_tag: ${{ fromJSON(needs.resolve.outputs.release_tags) }}
        target: [arm64, x86_64]
        include:
          - target: arm64
            display_name: Apple Silicon
            runner: macos-15
            artifact_suffix: arm64
            electron_arch: arm64
          - target: x86_64
            display_name: Intel
            runner: macos-15-intel
            artifact_suffix: x86_64
            electron_arch: x64

    steps:
      - name: Check out packaging automation
        uses: actions/checkout@v7
        with:
          path: automation

      - name: Check out exact upstream release tag
        uses: actions/checkout@v7
        with:
          repository: DNT-LAB/NAIA2.0
          ref: ${{ matrix.release_tag }}
          fetch-depth: 1
          path: source

      - name: Read upstream build metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ matrix.release_tag }}
        run: |
          echo "commit=$(git -C source rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          safe_tag="${RELEASE_TAG//\//-}"
          echo "safe_tag=${safe_tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements-headless.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/app/electron/package-lock.json

      - name: Install backend and Electron dependencies
        working-directory: source
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install --requirement requirements-headless.txt
          npm ci --prefix app/electron --no-audit --no-fund

      - name: Stage backend and bundled Python runtime
        working-directory: source
        run: |
          python tools/stage_electron_release.py \
            --source . --target app/electron/dist/NAIA-Web --copy
          python tools/stage_python_runtime.py \
            app/electron/dist/NAIA-Web "${pythonLocation}" --copy
          python ../automation/packaging/prune_python_runtime.py \
            app/electron/dist/NAIA-Web/resources/python
          cp ../automation/packaging/naia_backend_launcher.sh \
            app/electron/dist/NAIA-Web/resources/naia-backend/NAIA_web_headless
          chmod +x app/electron/dist/NAIA-Web/resources/naia-backend/NAIA_web_headless
          python tools/check_electron_packaging_inputs.py --require-bundled-python

      - name: Prepare macOS Electron configuration
        working-directory: source/app/electron
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const packagePath = "package.json";
          const packageJson = JSON.parse(fs.readFileSync(packagePath, "utf8"));
          if (packageJson.build?.mac?.icon && !fs.existsSync(packageJson.build.mac.icon)) {
            delete packageJson.build.mac.icon;
          }
          packageJson.build.mac.identity = "-";
          packageJson.build.mac.hardenedRuntime = false;
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      - name: Build standalone Electron app bundle
        working-directory: source/app/electron
        env:
          ELECTRON_ARCH: ${{ matrix.electron_arch }}
        run: ./node_modules/.bin/electron-builder --mac dir "--${ELECTRON_ARCH}" --publish never

      - name: Locate app bundle
        id: bundle
        working-directory: source
        run: |
          app_path="$(find app/electron/dist -maxdepth 3 -type d -name 'NAIA.app' -print -quit)"
          if [[ -z "${app_path}" ]]; then
            echo "NAIA.app was not produced" >&2
            exit 1
          fi
          echo "app_path=${app_path}" >> "${GITHUB_OUTPUT}"

      - name: Verify bundle structure, architecture, and signature
        working-directory: source
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.target }}
          APP_PATH: ${{ steps.bundle.outputs.app_path }}
        run: |
          test -x "${APP_PATH}/Contents/MacOS/NAIA"
          test -x "${APP_PATH}/Contents/Resources/python/bin/python"
          test -x "${APP_PATH}/Contents/Resources/naia-backend/NAIA_web_headless"
          test -f "${APP_PATH}/Contents/Resources/naia-backend/NAIA_web_headless.py"
          plutil -lint "${APP_PATH}/Contents/Info.plist"

          electron_architectures="$(lipo -archs "${APP_PATH}/Contents/MacOS/NAIA")"
          python_architectures="$(lipo -archs "${APP_PATH}/Contents/Resources/python/bin/python")"
          echo "Electron architectures: ${electron_architectures}"
          echo "Python architectures: ${python_architectures}"
          case " ${electron_architectures} " in
            *" ${EXPECTED_ARCHITECTURE} "*) ;;
            *) echo "Electron is missing ${EXPECTED_ARCHITECTURE}" >&2; exit 1 ;;
          esac
          case " ${python_architectures} " in
            *" ${EXPECTED_ARCHITECTURE} "*) ;;
            *) echo "Python is missing ${EXPECTED_ARCHITECTURE}" >&2; exit 1 ;;
          esac

          "${APP_PATH}/Contents/Resources/python/bin/python" - <<'PY'
          import fastapi
          import numpy
          import pandas
          import PIL
          import pyarrow
          import uvicorn
          print("Bundled Python imports succeeded")
          PY

          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"

      - name: Smoke test packaged app and backend
        working-directory: source
        env:
          APP_PATH: ${{ steps.bundle.outputs.app_path }}
        run: |
          smoke_root="$(mktemp -d)"
          smoke_log="${smoke_root}/naia.log"
          NAIA_BACKEND_PORT=17243 \
          NAIA_ELECTRON_SKIP_RUNTIME_INSTALL=1 \
          "${APP_PATH}/Contents/MacOS/NAIA" \
            "--user-data-dir=${smoke_root}/electron" >"${smoke_log}" 2>&1 &
          app_pid=$!

          cleanup() {
            kill "${app_pid}" >/dev/null 2>&1 || true
            wait "${app_pid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for _attempt in $(seq 1 90); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:17243/api/status >"${smoke_root}/status.json"; then
              ready=true
              break
            fi
            if ! kill -0 "${app_pid}" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          if [[ "${ready}" != "true" ]]; then
            echo "Packaged app did not start its backend" >&2
            cat "${smoke_log}" >&2
            exit 1
          fi
          cat "${smoke_root}/status.json"

      - name: Archive app bundle
        working-directory: source
        env:
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
          APP_PATH: ${{ steps.bundle.outputs.app_path }}
          SAFE_TAG: ${{ steps.metadata.outputs.safe_tag }}
        run: |
          archive="NAIA2-${SAFE_TAG}-macOS-${ARTIFACT_SUFFIX}.zip"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${archive}"
          shasum -a 256 "${archive}" > "${archive}.sha256"

      - name: Upload standalone app artifact
        uses: actions/upload-artifact@v7
        with:
          name: NAIA2-${{ steps.metadata.outputs.safe_tag }}-macOS-${{ matrix.artifact_suffix }}
          path: |
            source/NAIA2-${{ steps.metadata.outputs.safe_tag }}-macOS-${{ matrix.artifact_suffix }}.zip
            source/NAIA2-${{ steps.metadata.outputs.safe_tag }}-macOS-${{ matrix.artifact_suffix }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish standalone macOS releases
    needs: [resolve, build]
    if: needs.resolve.outputs.should_build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out origin history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download built app artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Mirror tags and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGS: ${{ needs.resolve.outputs.release_tags }}
          UPSTREAM_REPOSITORY: DNT-LAB/NAIA2.0
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"

          while IFS= read -r release_tag; do
            git fetch --force --no-tags upstream \
              "refs/tags/${release_tag}:refs/tags/${release_tag}"
            git push origin "refs/tags/${release_tag}:refs/tags/${release_tag}"

            mapfile -t assets < <(
              find artifacts -type f \
                \( -name "NAIA2-${release_tag}-macOS-*.zip" \
                   -o -name "NAIA2-${release_tag}-macOS-*.zip.sha256" \) \
                -print | sort
            )
            if (( ${#assets[@]} != 4 )); then
              echo "Expected four release files for ${release_tag}, found ${#assets[@]}" >&2
              exit 1
            fi

            if ! gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              prerelease="$(gh api \
                "repos/${UPSTREAM_REPOSITORY}/releases/tags/${release_tag}" \
                --jq '.prerelease')"
              release_args=(
                "${release_tag}"
                --repo "${GITHUB_REPOSITORY}"
                --verify-tag
                --title "NAIA2 ${release_tag} standalone macOS"
                --notes "Standalone macOS builds of upstream release ${release_tag}. Source: https://github.com/${UPSTREAM_REPOSITORY}/releases/tag/${release_tag}"
              )
              if [[ "${prerelease}" == "true" ]]; then
                release_args+=(--prerelease)
              fi
              gh release create "${release_args[@]}"
            fi

            gh release upload "${release_tag}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" --clobber
          done < <(jq -r '.[]' <<< "${RELEASE_TAGS}")
